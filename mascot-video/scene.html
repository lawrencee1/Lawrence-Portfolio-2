<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mascot video scene</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  /* colour wash + halftone dots in two corners, like a print overlay */
  #wash { background:
      radial-gradient(circle at 0% 100%, rgba(122, 70, 255, .5), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(255, 90, 190, .45), transparent 38%),
      radial-gradient(circle at 100% 100%, rgba(255, 160, 90, .22), transparent 36%);
    mix-blend-mode: soft-light; }
  #dots { background-image: radial-gradient(rgba(255,255,255,.5) 30%, transparent 33%); background-size: 1.7vw 1.7vw;
    -webkit-mask-image: radial-gradient(circle at 0% 100%, #000 2%, transparent 27%), radial-gradient(circle at 100% 0%, #000 2%, transparent 25%);
    -webkit-mask-composite: source-over; }
  #dots2 { background-image: radial-gradient(rgba(140,80,255,.35) 30%, transparent 33%); background-size: 1.7vw 1.7vw; background-position: .85vw .85vw;
    -webkit-mask-image: radial-gradient(circle at 0% 100%, #000 0%, transparent 18%); }
  #flash { background: #fff; opacity: 0; }
  #sub {
    position: absolute; left: 6%; right: 6%; top: 80%;
    text-align: center; color: #fff; font-family: 'Lora', serif; font-weight: 500;
    font-size: 5.8vw; line-height: 1.25;
    text-shadow: 0 0.25vw 0.5vw rgba(70,20,120,.9), 0 0 2.4vw rgba(90,30,160,.8), 0 0 5vw rgba(90,30,160,.5);
  }
  #title { position: absolute; left: 0; right: 0; top: 79%; text-align: center; color: #fff; }
  #title .n { font-family: 'Anton', sans-serif; font-size: 13vw; letter-spacing: .01em; line-height: 1;
    text-transform: uppercase; text-shadow: 0 0.5vw 0 #8a5cff, 0 0.8vw 3vw rgba(90,30,160,.6); }
  #title .s { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 3.1vw; margin-top: 2.6vw;
    color: #fff; letter-spacing: .08em; text-transform: uppercase; display: inline-block; background: #8a5cff; padding: 1vw 2.4vw; border-radius: 3vw; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="acc"></canvas>
<div class="fx" id="wash"></div><div class="fx" id="dots"></div><div class="fx" id="dots2"></div>
<div class="fx" id="flash"></div>
<div id="sub"></div>
<div id="title"><div class="n">Lawrence Nathan</div><div class="s">Design + video for social media</div></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const outBack = k => { const c = 1.9; const x = k - 1; return 1 + (c + 1) * x * x * x + c * x * x; };
const outCubic = k => 1 - Math.pow(1 - k, 3);
const outExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const inOutQuint = k => k < 0.5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2;
function rng(seed) { let s = seed; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const ACID = '#c6ff3d', PINK = '#ff5fa2', BLUE = '#4f8cff', REC = '#ff3b30', INK = '#0b0b0c';
const LAV = '#b9a2ff', PURPLE = '#8a5cff', ROSE = '#ff8fd0', HOT = '#ff5fb0', ORANGE = '#ff8a4c';

/* ---------- fonts ---------- */
const F = 'node_modules/@fontsource/';
const fonts = [
  ['Anton', F + 'anton/files/anton-latin-400-normal.woff2', '400'],
  ['Space Grotesk', F + 'space-grotesk/files/space-grotesk-latin-600-normal.woff2', '600'],
  ['Space Grotesk', F + 'space-grotesk/files/space-grotesk-latin-700-normal.woff2', '700'],
  ['JetBrains Mono', F + 'jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2', '500'],
  ['Lora', F + 'lora/files/lora-latin-500-normal.woff2', '500'],
];
await Promise.all(fonts.map(async ([fam, url, weight]) => {
  const f = new FontFace(fam, `url(${url})`, { weight }); await f.load(); document.fonts.add(f);
}));

/* ---------- renderer ---------- */
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);
const accCanvas = document.getElementById('acc'); accCanvas.width = W; accCanvas.height = H;
const accCtx = accCanvas.getContext('2d');

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e7d3ff');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

const camera = new THREE.PerspectiveCamera(28, W / H, 0.5, 70);

/* ---------- materials ---------- */
const plastic = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.35, ...o });
const rbox = (w, h, d, r, mat, seg = 5) => {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, seg, r), mat);
  m.castShadow = true; m.receiveShadow = true; return m;
};
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const basic = (color, k = 1) => { const m = new THREE.MeshBasicMaterial({ color }); m.color.multiplyScalar(k); return m; };

/* ---------- set: pastel desk, glowing window, soft shapes ---------- */
const table = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: '#cdb4ff', roughness: 0.55 }));
table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);

const dome = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16),
  new THREE.MeshBasicMaterial({ map: canvasTex(16, 256, (c, w, h) => {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#f08fd6'); g.addColorStop(0.3, '#c9a2ff'); g.addColorStop(0.49, '#e2c8ff'); g.addColorStop(0.6, '#b995ff'); g.addColorStop(1, '#a884f5');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  }) }));
dome.geometry.scale(-1, 1, 1);   // inside-out so it also lands in the depth pass
scene.add(dome);
{
  // window behind the desk: the main glow source
  const win = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 9), basic('#f1e2ff', 1.0)); win.position.set(0.6, 5.2, -8); scene.add(win);
  const frameM = new THREE.MeshStandardMaterial({ color: '#f1e6ff', roughness: 0.6 });
  for (const [w, h, x, y] of [[8.1, 0.3, 0.6, 9.8], [8.1, 0.3, 0.6, 0.7], [0.3, 9.4, -3.3, 5.2], [0.3, 9.4, 4.5, 5.2], [0.18, 9, 0.6, 5.2], [7.6, 0.18, 0.6, 5.6]]) {
    const b = rbox(w, h, 0.3, 0.05, frameM, 2); b.position.set(x, y, -7.9); b.castShadow = false; scene.add(b); }
  for (let i = 0; i < 6; i++) { const cur = rbox(0.7, 11, 0.5, 0.25, new THREE.MeshStandardMaterial({ color: i % 2 ? '#ff9ad8' : '#f77fc8', roughness: 0.8 }), 3);
    cur.position.set(-4.2 - i * 0.62, 5.3, -7.4 + (i % 2) * 0.25); cur.castShadow = false; scene.add(cur); }
  const big = [['#ffb3e4', 8, 2.2, -4, 4, 5], ['#c9b0ff', -9, 2, 2, 3, 4.4], ['#ffffff', 10, 1.2, 3, 3, 2.4], ['#ffc9a3', -8, 0.8, -3, 4, 1.6], ['#a98bff', 9, 3.5, -1, 2, 7], ['#ffd1f0', -10, 3, -1, 2, 6],
    ['#c9b0ff', 2, 3, 14, 6, 6], ['#ffb3e4', -6, 2, 13, 4, 4]];
  for (const [c, x, y, z, w, h] of big) { const m = rbox(w, h, 1.2, 0.3, new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 }), 3);
    m.position.set(x, y, z); m.lookAt(0, y, 0); m.castShadow = false; scene.add(m); }
}
// floating sparkle dust (turns into bokeh)
const dust = []; { const r = rng(21); const g = new THREE.SphereGeometry(1, 8, 6); const m1 = basic('#ffffff', 1.3), m2 = basic('#ffd0f2', 1.2);
  for (let i = 0; i < 150; i++) { const m = new THREE.Mesh(g, i % 3 ? m1 : m2); const s = 0.008 + r() * 0.02; m.scale.setScalar(s);
    const p = [(r() - 0.5) * 9, 0.2 + r() * 6.5, -4 + r() * 12]; dust.push({ m, p, ph: r() * 6.28, sp: 0.2 + r() * 0.5 }); scene.add(m); } }

/* ---------- lights ---------- */
const key = new THREE.DirectionalLight('#fff3fb', 2.1);
key.position.set(3.5, 7, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 7; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 7, bottom: -3, near: 1, far: 25 });
scene.add(key);
scene.add(new THREE.HemisphereLight('#fff0fb', '#b79cff', 0.75));
const rim = new THREE.DirectionalLight('#ffffff', 1.2); rim.position.set(-1, 5, -7); scene.add(rim);
const pinkFill = new THREE.PointLight('#ff6fc8', 7, 14, 1.6); pinkFill.position.set(-4, 2.5, 3); scene.add(pinkFill);
const screenGlow = new THREE.PointLight('#e6d6ff', 0, 5, 1.6); scene.add(screenGlow);

/* ---------- mascot ---------- */
const skinM = plastic('#f3cdb8');
const hairM = plastic('#1b191a', { roughness: 0.5, clearcoat: 0.5 });
const frameM = plastic('#4a4643', { roughness: 0.5 });
const darkM = plastic('#1d1c1f', { roughness: 0.55 });
const shirtTex = canvasTex(512, 512, (c, w, h) => {
  c.fillStyle = '#1f1e21'; c.fillRect(0, 0, w, h);
  const r = rng(3); const cream = '#e9dcc3';
  const flower = (x, y, s) => { c.fillStyle = cream;
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; c.beginPath(); c.ellipse(x + Math.cos(a) * s, y + Math.sin(a) * s, s * 0.62, s * 0.38, a, 0, 7); c.fill(); }
    c.fillStyle = '#1f1e21'; c.beginPath(); c.arc(x, y, s * 0.3, 0, 7); c.fill(); };
  const sprig = (x, y, s, rot) => { c.save(); c.translate(x, y); c.rotate(rot); c.strokeStyle = cream; c.lineWidth = s * 0.09; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, -s); c.quadraticCurveTo(s * 0.15, 0, 0, s); c.stroke();
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(0, i * s * 0.32); c.quadraticCurveTo(s * 0.5, i * s * 0.32 - s * 0.25, s * 0.62, i * s * 0.32 - s * 0.05); c.stroke();
      c.beginPath(); c.moveTo(0, i * s * 0.32); c.quadraticCurveTo(-s * 0.5, i * s * 0.32 - s * 0.25, -s * 0.62, i * s * 0.32 - s * 0.05); c.stroke(); }
    c.restore(); };
  for (let gy = 0; gy < 4; gy++) for (let gx = 0; gx < 4; gx++) {
    const x = (gx + 0.5) * 128 + (r() - 0.5) * 40, y = (gy + 0.5) * 128 + (r() - 0.5) * 40;
    ((gx + gy) % 2 === 0) ? flower(x, y, 20 + r() * 9) : sprig(x, y, 44 + r() * 12, (r() - 0.5) * 1.2);
  }
});
const shirtM = plastic('#ffffff', { map: shirtTex, roughness: 0.6, clearcoat: 0.2 });

const mascot = new THREE.Group(); scene.add(mascot);
const bodyG = new THREE.Group(); mascot.add(bodyG);
const body = rbox(0.82, 0.66, 0.62, 0.09, shirtM); body.position.y = 0.62; bodyG.add(body);
const legL = rbox(0.27, 0.34, 0.32, 0.06, darkM); legL.position.set(-0.19, 0.17, 0); bodyG.add(legL);
const legR = legL.clone(); legR.position.x = 0.19; bodyG.add(legR);
const mkArm = (sx) => { const g = new THREE.Group(); g.position.set(sx * 0.52, 0.86, 0);
  const a = rbox(0.2, 0.46, 0.26, 0.07, shirtM); a.position.y = -0.2; g.add(a); bodyG.add(g); return g; };
const armL = mkArm(-1), armR = mkArm(1);

const headG = new THREE.Group(); headG.position.y = 0.95; mascot.add(headG);
const head = rbox(1.16, 0.96, 1.0, 0.13, skinM, 6); head.position.y = 0.5; headG.add(head);
// hair
const hair = new THREE.Group(); hair.position.y = 0.5; headG.add(hair);
const addHair = (w, h, d, x, y, z, rz = 0, rx = 0) => { const m = rbox(w, h, d, Math.min(w, h, d) * 0.3, hairM); m.position.set(x, y, z); m.rotation.set(rx, 0, rz); hair.add(m); return m; };
addHair(1.26, 0.3, 1.1, 0, 0.55, -0.02);                 // top slab
addHair(1.22, 0.62, 0.16, 0, 0.2, -0.5);                 // back
addHair(0.34, 0.34, 0.36, -0.66, 0.42, 0.3, 0.12);       // tuft sticking out
addHair(0.3, 0.36, 0.34, -0.36, 0.52, 0.42, 0.04);
addHair(0.32, 0.4, 0.34, -0.03, 0.5, 0.44);
addHair(0.52, 0.34, 0.34, 0.39, 0.56, 0.42, -0.03);
addHair(0.15, 0.56, 0.6, 0.62, 0.2, 0.05);               // side lock
addHair(0.12, 0.3, 0.5, -0.62, 0.3, -0.1);
// glasses
const face = new THREE.Group(); face.position.set(0, 0.5, 0.5); headG.add(face);
function frameGeo(o, i, r, depth) {
  const s = new THREE.Shape(); const h = o / 2;
  s.moveTo(-h + r, -h); s.lineTo(h - r, -h); s.quadraticCurveTo(h, -h, h, -h + r); s.lineTo(h, h - r); s.quadraticCurveTo(h, h, h - r, h);
  s.lineTo(-h + r, h); s.quadraticCurveTo(-h, h, -h, h - r); s.lineTo(-h, -h + r); s.quadraticCurveTo(-h, -h, -h + r, -h);
  const k = i / 2; const hole = new THREE.Path(); hole.moveTo(-k, -k); hole.lineTo(-k, k); hole.lineTo(k, k); hole.lineTo(k, -k); hole.closePath(); s.holes.push(hole);
  return new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelSize: 0.012, bevelThickness: 0.012, bevelSegments: 2 });
}
const fGeo = frameGeo(0.4, 0.29, 0.04, 0.05);
const lensM = plastic('#fbeee6', { roughness: 0.3 }); const pupilM = plastic('#5b544f', { roughness: 0.5 });
const pupils = [];
for (const sx of [-1, 1]) {
  const fr = new THREE.Mesh(fGeo, frameM); fr.castShadow = true; fr.position.set(sx * 0.285, 0.09, 0.0); face.add(fr);
  const lens = rbox(0.3, 0.3, 0.02, 0.008, lensM, 2); lens.position.set(sx * 0.285, 0.09, 0.012); lens.castShadow = false; face.add(lens);
  const p = rbox(0.1, 0.13, 0.03, 0.012, pupilM, 2); p.position.set(sx * 0.285, 0.09, 0.03); p.castShadow = false; face.add(p); pupils.push(p);
}
const bridge = rbox(0.2, 0.045, 0.045, 0.015, frameM, 2); bridge.position.set(0, 0.1, 0.03); face.add(bridge);
for (const sx of [-1, 1]) { const t = rbox(0.045, 0.045, 0.5, 0.015, frameM, 2); t.position.set(sx * 0.585, 0.12, -0.24); face.add(t); }
const mouthM = plastic('#6b5750', { roughness: 0.6 });
const mouth = rbox(0.28, 0.05, 0.03, 0.012, mouthM, 2); mouth.position.set(0, -0.2, 0.012); mouth.castShadow = false; face.add(mouth);
const smile = new THREE.Group(); smile.position.set(0, -0.2, 0.012); face.add(smile);
{ const a = rbox(0.22, 0.05, 0.03, 0.012, mouthM, 2); a.position.y = -0.03; smile.add(a);
  for (const sx of [-1, 1]) { const b = rbox(0.05, 0.11, 0.03, 0.012, mouthM, 2); b.position.set(sx * 0.13, 0.0, 0); smile.add(b); } }


/* ---------- laptop ---------- */
const laptop = new THREE.Group(); laptop.position.set(1.25, 0, 0); laptop.rotation.y = -Math.PI / 2; scene.add(laptop);
const alu = new THREE.MeshPhysicalMaterial({ color: '#c9ccd2', metalness: 0.6, roughness: 0.38, clearcoat: 0.2 });
const lbase = rbox(1.08, 0.05, 0.74, 0.022, alu, 3); lbase.position.y = 0.03; laptop.add(lbase);
const keysTex = canvasTex(512, 256, (c, w, h) => { c.fillStyle = '#1a1a1d'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#34343a'; for (let r = 0; r < 5; r++) for (let k = 0; k < 13; k++) { rr(c, 8 + k * 38.4, 8 + r * 48.5, 32, 42, 6); c.fill(); } });
const keys = new THREE.Mesh(new THREE.PlaneGeometry(0.94, 0.36), new THREE.MeshStandardMaterial({ map: keysTex, roughness: 0.6 }));
keys.rotation.x = -Math.PI / 2; keys.position.set(0, 0.0565, -0.11); laptop.add(keys);
const pad = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.2), new THREE.MeshStandardMaterial({ color: '#b3b6bc', roughness: 0.3, metalness: 0.5 }));
pad.rotation.x = -Math.PI / 2; pad.position.set(0, 0.0565, 0.22); laptop.add(pad);
const lid = new THREE.Group(); lid.position.set(0, 0.055, -0.36); laptop.add(lid);
const lidPanel = rbox(1.08, 0.74, 0.035, 0.016, alu, 3); lidPanel.position.set(0, 0.37, 0); lid.add(lidPanel);
const sticker = rbox(0.16, 0.16, 0.01, 0.004, new THREE.MeshStandardMaterial({ color: ACID, roughness: 0.4 }), 2); sticker.position.set(0, 0.38, -0.02); lid.add(sticker);
const bezel = new THREE.Mesh(new THREE.PlaneGeometry(1.04, 0.7), new THREE.MeshStandardMaterial({ color: '#0a0a0b', roughness: 0.3 }));
bezel.position.set(0, 0.37, 0.0185); lid.add(bezel);
const SCW = 1024, SCH = 656;
const scrCanvas = document.createElement('canvas'); scrCanvas.width = SCW; scrCanvas.height = SCH;
const scrCtx = scrCanvas.getContext('2d');
const scrTex = new THREE.CanvasTexture(scrCanvas); scrTex.colorSpace = THREE.SRGBColorSpace; scrTex.anisotropy = 8;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.98, 0.628), new THREE.MeshBasicMaterial({ map: scrTex }));
screen.position.set(0, 0.372, 0.0195); lid.add(screen);

/* ---------- the post design (shared by laptop screen and the finished card) ---------- */
function drawPost(c, x, y, s, k = 1) {   // k = build progress 0..1
  c.save(); c.translate(x, y); c.beginPath(); c.rect(0, 0, s, s); c.clip();
  c.fillStyle = '#16161a'; c.fillRect(0, 0, s, s);
  const a = ease(seg(k, 0.0, 0.2)); c.fillStyle = ACID; c.fillRect(0, s * (1 - a), s, s * a);
  const b = outBack(seg(k, 0.2, 0.4)); if (b > 0) { c.fillStyle = INK; c.beginPath(); c.arc(s * 0.74, s * 0.3, s * 0.2 * b, 0, 7); c.fill();
    c.fillStyle = PINK; c.beginPath(); c.arc(s * 0.74, s * 0.3, s * 0.085 * b, 0, 7); c.fill(); }
  c.fillStyle = INK; c.font = `400 ${s * 0.3}px Anton`; c.textBaseline = 'alphabetic';
  const txt = 'NEW DROP'; const n = Math.round(seg(k, 0.38, 0.7) * txt.length); const shown = txt.slice(0, n).split(' ');
  c.fillText(shown[0] || '', s * 0.07, s * 0.62); if (shown[1]) c.fillText(shown[1], s * 0.07, s * 0.9);
  const d = ease(seg(k, 0.7, 0.85)); c.fillStyle = INK; c.fillRect(s * 0.07, s * 0.08, s * 0.3 * d, s * 0.055);
  if (k > 0.88) { c.fillStyle = INK; c.font = `500 ${s * 0.045}px JetBrains Mono`; c.fillText('SWIPE  >>', s * 0.07, s * 0.2); }
  c.restore();
}

/* ---------- laptop screen: an editor building the client's post + reel ---------- */
function drawScreen(c, u) {
  c.fillStyle = '#0d0d0f'; c.fillRect(0, 0, SCW, SCH);
  c.fillStyle = '#17171b'; c.fillRect(0, 0, SCW, 44);
  c.fillStyle = REC; c.beginPath(); c.arc(26, 22, 8, 0, 7); c.fill();
  c.fillStyle = '#d9d9de'; c.font = '500 20px JetBrains Mono'; c.textBaseline = 'middle'; c.fillText('CLIENT_POST + REEL', 46, 23);
  const tc = Math.max(0, u); const fr = String(Math.floor((tc % 1) * 30)).padStart(2, '0');
  c.textAlign = 'right'; c.fillStyle = ACID; c.fillText(`00:00:${String(Math.floor(tc)).padStart(2, '0')}:${fr}`, SCW - 20, 23); c.textAlign = 'left';
  // artboard
  c.fillStyle = '#131316'; c.fillRect(16, 56, 636, 384);
  drawPost(c, 154, 68, 360, seg(u, 0.2, 2.5));
  c.strokeStyle = '#3a3a42'; c.lineWidth = 2; c.strokeRect(154, 68, 360, 360);

const _p = new THREE.Vector3(), _l = new THREE.Vector3(), _f = new THREE.Vector3();

/* motion blur: average several sub-frames across the shutter; more samples when things move fast */
