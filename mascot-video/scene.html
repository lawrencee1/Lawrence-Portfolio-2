<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const outBack = k => { const c = 1.9; const x = k - 1; return 1 + (c + 1) * x * x * x + c * x * x; };
const outCubic = k => 1 - Math.pow(1 - k, 3);
const outExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const inOutQuint = k => k < 0.5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2;
function rng(seed) { let s = seed; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const ACID = '#c6ff3d', PINK = '#ff5fa2', BLUE = '#4f8cff', REC = '#ff3b30', INK = '#0b0b0c';
const LAV = '#b9a2ff', PURPLE = '#8a5cff', ROSE = '#ff8fd0', HOT = '#ff5fb0', ORANGE = '#ff8a4c';

/* ---------- fonts ---------- */
const F = 'node_modules/@fontsource/';
const fonts = [
  ['Anton', F + 'anton/files/anton-latin-400-normal.woff2', '400'],
  ['Space Grotesk', F + 'space-grotesk/files/space-grotesk-latin-600-normal.woff2', '600'],
  ['Space Grotesk', F + 'space-grotesk/files/space-grotesk-latin-700-normal.woff2', '700'],
  ['JetBrains Mono', F + 'jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2', '500'],
  ['Lora', F + 'lora/files/lora-latin-500-normal.woff2', '500'],
];
await Promise.all(fonts.map(async ([fam, url, weight]) => {
  const f = new FontFace(fam, `url(${url})`, { weight }); await f.load(); document.fonts.add(f);
}));

/* ---------- renderer ---------- */
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);
const accCanvas = document.getElementById('acc'); accCanvas.width = W; accCanvas.height = H;
const accCtx = accCanvas.getContext('2d');

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e7d3ff');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

const camera = new THREE.PerspectiveCamera(28, W / H, 0.5, 70);

/* ---------- materials ---------- */
const plastic = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.35, ...o });
const rbox = (w, h, d, r, mat, seg = 5) => {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, seg, r), mat);
  m.castShadow = true; m.receiveShadow = true; return m;
};
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const basic = (color, k = 1) => { const m = new THREE.MeshBasicMaterial({ color }); m.color.multiplyScalar(k); return m; };

/* ---------- set: a pastel room, desk by a glowing window ---------- */
const stdM = (color, rough = 0.6) => new THREE.MeshStandardMaterial({ color, roughness: rough });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), stdM('#c9aef5'));
floor.rotation.x = -Math.PI / 2; floor.position.y = -2.4; floor.receiveShadow = true; scene.add(floor);
const desk = rbox(8.4, 0.16, 4.2, 0.06, stdM('#e3d3ff', 0.5), 3); desk.position.set(0, -0.08, 0.2); scene.add(desk);
for (const [x, z] of [[-3.9, -1.6], [3.9, -1.6], [-3.9, 2.0], [3.9, 2.0]]) { const l = rbox(0.16, 2.3, 0.16, 0.05, stdM('#ffffff'), 2); l.position.set(x, -1.25, z); scene.add(l); }

const dome = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16),
  new THREE.MeshBasicMaterial({ map: canvasTex(16, 256, (c, w, h) => {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#f08fd6'); g.addColorStop(0.3, '#c9a2ff'); g.addColorStop(0.49, '#e2c8ff'); g.addColorStop(0.6, '#b995ff'); g.addColorStop(1, '#a884f5');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  }) }));
dome.geometry.scale(-1, 1, 1);   // inside-out so it also lands in the depth pass
scene.add(dome);
{
  const wallM = stdM('#f1b8ea', 0.9);
  for (const [w, h, x, y] of [[30, 3.2, 0, -1.4], [30, 6, 0, 7.4], [9.5, 4.4, -9.2, 2.2], [9.5, 4.4, 10.2, 2.2]]) {   // back wall around the window
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.3), wallM); b.position.set(x, y, -3.6); b.receiveShadow = true; scene.add(b); }
  const win = new THREE.Mesh(new THREE.PlaneGeometry(10, 4.6), basic('#f6e6ff', 1.06)); win.position.set(0.5, 2.2, -4.2); scene.add(win);
  for (const [w, h, x, y] of [[10.2, 0.14, 0.5, 2.2], [0.14, 4.4, -1.9, 2.2], [0.14, 4.4, 2.9, 2.2]]) { const b = rbox(w, h, 0.2, 0.04, stdM('#ffffff'), 2); b.position.set(x, y, -3.55); b.castShadow = false; scene.add(b); }
  const side = new THREE.Mesh(new THREE.BoxGeometry(0.3, 14, 30), stdM('#ee9fe0', 0.9)); side.position.set(8.5, 4, 2); scene.add(side);
  for (let i = 0; i < 5; i++) { const cur = rbox(0.6, 9, 0.5, 0.22, stdM(i % 2 ? '#ff9ad8' : '#f77fc8', 0.8), 3); cur.position.set(-5.2 - i * 0.55, 2.4, -3.2 + (i % 2) * 0.2); cur.castShadow = false; scene.add(cur); }
  const clock = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.1, 40), stdM('#ffffff', 0.4)); clock.rotation.x = Math.PI / 2; clock.position.set(-7.4, 4.6, -3.4); scene.add(clock);
  for (let i = 0; i < 6; i++) { const n = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), basic(['#ffe9a8', '#ffc9e6', '#d6c4ff'][i % 3])); n.position.set(6.1 + (i % 3) * 0.6, 3.6 - Math.floor(i / 3) * 0.6, -3.43); n.rotation.z = (i % 2 - 0.5) * 0.12; scene.add(n); }
  // chair
  const ch = new THREE.Group(); const cm = plastic('#b79cff', { roughness: 0.6 });
  const seat = rbox(1.7, 0.3, 1.6, 0.14, cm); seat.position.y = -0.95; ch.add(seat);
  const back = rbox(1.7, 1.9, 0.3, 0.14, cm); back.position.set(0, 0.1, 0.8); back.rotation.x = 0.12; ch.add(back);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.3, 12), stdM('#ffffff', 0.3)); post.position.y = -1.7; ch.add(post);
  for (let i = 0; i < 5; i++) { const leg = rbox(0.9, 0.08, 0.1, 0.03, stdM('#ffffff', 0.3), 2); leg.position.set(Math.cos(i * 1.257) * 0.45, -2.32, Math.sin(i * 1.257) * 0.45); leg.rotation.y = -i * 1.257; ch.add(leg); }
  ch.position.set(4.6, 0, 3.6); ch.rotation.y = -0.5; ch.traverse(o => { if (o.isMesh) o.castShadow = true; }); scene.add(ch);
}
// floating sparkle dust (turns into bokeh)
const dust = []; { const r = rng(21); const g = new THREE.SphereGeometry(1, 8, 6); const m1 = basic('#ffffff', 1.3), m2 = basic('#ffd0f2', 1.2);
  for (let i = 0; i < 170; i++) { const m = new THREE.Mesh(g, i % 3 ? m1 : m2); const s = 0.008 + r() * 0.02; m.scale.setScalar(s);
    const p = [(r() - 0.5) * 12, 0.1 + r() * 6.5, -3 + r() * 10]; dust.push({ m, p, ph: r() * 6.28, sp: 0.2 + r() * 0.5 }); scene.add(m); } }

/* ---------- lights ---------- */
const key = new THREE.DirectionalLight('#fff3fb', 2.1);
key.position.set(3.5, 7, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 7; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -7, right: 7, top: 7, bottom: -5, near: 1, far: 30 });
scene.add(key);
scene.add(new THREE.HemisphereLight('#fff0fb', '#b79cff', 0.75));
const rim = new THREE.DirectionalLight('#ffffff', 1.2); rim.position.set(-1, 5, -7); scene.add(rim);
const pinkFill = new THREE.PointLight('#ff6fc8', 7, 14, 1.6); pinkFill.position.set(-4, 2.5, 3); scene.add(pinkFill);
const screenGlow = new THREE.PointLight('#e6d6ff', 0, 5, 1.6); scene.add(screenGlow);

/* ---------- laptop ---------- */
const laptop = new THREE.Group(); laptop.position.set(0, 0, -0.5); scene.add(laptop);
const alu = new THREE.MeshPhysicalMaterial({ color: '#c9ccd2', metalness: 0.6, roughness: 0.38, clearcoat: 0.2 });
const lbase = rbox(1.08, 0.05, 0.74, 0.022, alu, 3); lbase.position.y = 0.03; laptop.add(lbase);
const keysTex = canvasTex(512, 256, (c, w, h) => { c.fillStyle = '#1a1a1d'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#34343a'; for (let r = 0; r < 5; r++) for (let k = 0; k < 13; k++) { rr(c, 8 + k * 38.4, 8 + r * 48.5, 32, 42, 6); c.fill(); } });
const keys = new THREE.Mesh(new THREE.PlaneGeometry(0.94, 0.36), new THREE.MeshStandardMaterial({ map: keysTex, roughness: 0.6 }));
keys.rotation.x = -Math.PI / 2; keys.position.set(0, 0.0565, -0.11); laptop.add(keys);
const pad = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.2), new THREE.MeshStandardMaterial({ color: '#b3b6bc', roughness: 0.3, metalness: 0.5 }));
pad.rotation.x = -Math.PI / 2; pad.position.set(0, 0.0565, 0.22); laptop.add(pad);
const lid = new THREE.Group(); lid.position.set(0, 0.055, -0.36); laptop.add(lid);
const lidPanel = rbox(1.08, 0.74, 0.035, 0.016, alu, 3); lidPanel.position.set(0, 0.37, 0); lid.add(lidPanel);
const sticker = rbox(0.16, 0.16, 0.01, 0.004, new THREE.MeshStandardMaterial({ color: ACID, roughness: 0.4 }), 2); sticker.position.set(0, 0.38, -0.02); lid.add(sticker);
const bezel = new THREE.Mesh(new THREE.PlaneGeometry(1.04, 0.7), new THREE.MeshStandardMaterial({ color: '#0a0a0b', roughness: 0.3 }));
bezel.position.set(0, 0.37, 0.0185); lid.add(bezel);
const SCW = 1024, SCH = 656;
const scrCanvas = document.createElement('canvas'); scrCanvas.width = SCW; scrCanvas.height = SCH;
const scrCtx = scrCanvas.getContext('2d');
const scrTex = new THREE.CanvasTexture(scrCanvas); scrTex.colorSpace = THREE.SRGBColorSpace; scrTex.anisotropy = 8;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.98, 0.628), new THREE.MeshBasicMaterial({ map: scrTex }));
screen.position.set(0, 0.372, 0.0195); lid.add(screen);

/* ---------- the post design (shared by laptop screen and the finished card) ---------- */
function drawPost(c, x, y, s, k = 1) {   // k = build progress 0..1
  c.save(); c.translate(x, y); c.beginPath(); c.rect(0, 0, s, s); c.clip();
  c.fillStyle = '#16161a'; c.fillRect(0, 0, s, s);
  const a = ease(seg(k, 0.0, 0.2)); c.fillStyle = ACID; c.fillRect(0, s * (1 - a), s, s * a);
  const b = outBack(seg(k, 0.2, 0.4)); if (b > 0) { c.fillStyle = INK; c.beginPath(); c.arc(s * 0.74, s * 0.3, s * 0.2 * b, 0, 7); c.fill();
    c.fillStyle = PINK; c.beginPath(); c.arc(s * 0.74, s * 0.3, s * 0.085 * b, 0, 7); c.fill(); }
  c.fillStyle = INK; c.font = `400 ${s * 0.3}px Anton`; c.textBaseline = 'alphabetic';
  const txt = 'NEW DROP'; const n = Math.round(seg(k, 0.38, 0.7) * txt.length); const shown = txt.slice(0, n).split(' ');
  c.fillText(shown[0] || '', s * 0.07, s * 0.62); if (shown[1]) c.fillText(shown[1], s * 0.07, s * 0.9);
  const d = ease(seg(k, 0.7, 0.85)); c.fillStyle = INK; c.fillRect(s * 0.07, s * 0.08, s * 0.3 * d, s * 0.055);
  if (k > 0.88) { c.fillStyle = INK; c.font = `500 ${s * 0.045}px JetBrains Mono`; c.fillText('SWIPE  >>', s * 0.07, s * 0.2); }
  c.restore();
}

/* ---------- laptop screen: an editor building the client's post + reel ---------- */
function drawScreen(c, u) {
  c.fillStyle = '#0d0d0f'; c.fillRect(0, 0, SCW, SCH);
  c.fillStyle = '#17171b'; c.fillRect(0, 0, SCW, 44);
  c.fillStyle = REC; c.beginPath(); c.arc(26, 22, 8, 0, 7); c.fill();
  c.fillStyle = '#d9d9de'; c.font = '500 20px JetBrains Mono'; c.textBaseline = 'middle'; c.fillText('CLIENT_POST + REEL', 46, 23);
  const tc = Math.max(0, u); const fr = String(Math.floor((tc % 1) * 30)).padStart(2, '0');
  c.textAlign = 'right'; c.fillStyle = ACID; c.fillText(`00:00:${String(Math.floor(tc)).padStart(2, '0')}:${fr}`, SCW - 20, 23); c.textAlign = 'left';
  // artboard
  c.fillStyle = '#131316'; c.fillRect(16, 56, 636, 384);
  drawPost(c, 154, 68, 360, seg(u, 0.2, 2.5));
  c.strokeStyle = '#3a3a42'; c.lineWidth = 2; c.strokeRect(154, 68, 360, 360);
  // layers panel
  c.fillStyle = '#17171b'; c.fillRect(664, 56, 344, 384);
  c.fillStyle = '#8a8a93'; c.font = '500 17px JetBrains Mono'; c.fillText('LAYERS', 682, 80);
  const layers = [['Background', ACID, 0.3], ['Circle', PINK, 0.8], ['NEW DROP', '#fff', 1.2], ['Tag', BLUE, 1.9], ['Reel 9:16', PINK, 2.4]];
  layers.forEach(([name, col, at], i) => { const k = outCubic(seg(u, at, at + 0.3)); if (k <= 0) return;
    c.globalAlpha = k; c.fillStyle = '#222228'; rr(c, 678 + (1 - k) * 30, 100 + i * 64, 316, 52, 8); c.fill();
    c.fillStyle = col; rr(c, 690 + (1 - k) * 30, 112 + i * 64, 28, 28, 5); c.fill();
    c.fillStyle = '#e6e6ea'; c.font = '600 21px Space Grotesk'; c.fillText(name, 732 + (1 - k) * 30, 127 + i * 64); c.globalAlpha = 1; });
  // timeline
  c.fillStyle = '#131316'; c.fillRect(16, 452, 992, 190);
  for (let i = 0; i < 3; i++) { c.fillStyle = '#1b1b20'; c.fillRect(28, 466 + i * 58, 968, 48); }
  const clips = [[0, 30, 300, BLUE, 1.6], [0, 340, 250, PINK, 1.9], [0, 600, 380, ACID, 2.2], [1, 90, 420, ACID, 2.5], [1, 520, 300, BLUE, 2.8], [2, 30, 950, '#3b3b44', 3.0]];
  for (const [row, x, w, col, at] of clips) { const k = outCubic(seg(u, at, at + 0.35)); if (k <= 0) continue;
    c.fillStyle = col; rr(c, 28 + x, 470 + row * 58, w * k, 40, 6); c.fill();
    if (row === 2) { c.strokeStyle = ACID; c.lineWidth = 2; c.beginPath();
      for (let i = 0; i < w * k; i += 6) { const hgt = 4 + 13 * Math.abs(Math.sin(i * 0.11) * Math.sin(i * 0.031 + 1)); c.moveTo(34 + x + i, 490 + row * 58 - hgt); c.lineTo(34 + x + i, 490 + row * 58 + hgt); }
      c.stroke(); } }
  const ph = 40 + ease(seg(u, 2.9, 3.5)) * 940; c.fillStyle = '#fff'; c.fillRect(ph, 458, 3, 180);
  c.beginPath(); c.moveTo(ph - 9, 452); c.lineTo(ph + 12, 452); c.lineTo(ph + 1.5, 468); c.fill();
  // cursor
  const pts = [[330, 250, 0], [600, 150, 0.7], [300, 300, 1.4], [830, 300, 2.0], [330, 490, 2.6], [700, 540, 3.2], [512, 330, 3.9]];
  let cx = pts[0][0], cy = pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) { const k = ease(seg(u, pts[i][2], pts[i + 1][2])); if (u >= pts[i][2]) { cx = lerp(pts[i][0], pts[i + 1][0], k); cy = lerp(pts[i][1], pts[i + 1][1], k); } }
  // export overlay
  const ex = seg(u, 3.4, 3.6);
  if (ex > 0) { c.globalAlpha = ex * 0.82; c.fillStyle = '#000'; c.fillRect(0, 0, SCW, SCH); c.globalAlpha = ex;
    c.fillStyle = '#17171b'; rr(c, 232, 228, 560, 200, 22); c.fill();
    const p = ease(seg(u, 3.6, 4.15)); const done = u > 4.2;
    c.fillStyle = '#fff'; c.font = '400 54px Anton'; c.textAlign = 'center'; c.fillText(done ? 'DONE' : 'EXPORTING', 512, 290);
    c.fillStyle = '#2a2a31'; rr(c, 282, 340, 460, 26, 13); c.fill(); c.fillStyle = ACID; rr(c, 282, 340, Math.max(26, 460 * p), 26, 13); c.fill();
    c.fillStyle = '#b9b9c2'; c.font = '500 22px JetBrains Mono'; c.fillText(done ? 'post + reel + story' : `${Math.round(p * 100)}%`, 512, 396);
    c.textAlign = 'left'; c.globalAlpha = 1; }
  c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = 2; c.beginPath();
  c.moveTo(cx, cy); c.lineTo(cx, cy + 26); c.lineTo(cx + 7, cy + 20); c.lineTo(cx + 13, cy + 32); c.lineTo(cx + 18, cy + 29); c.lineTo(cx + 12, cy + 18); c.lineTo(cx + 21, cy + 18); c.closePath(); c.fill(); c.stroke();
}


/* ---------- notification cards ---------- */
function roundedShape(w, h, r) { const s = new THREE.Shape(); const x0 = -w / 2, y0 = -h / 2;

}

/* kinetic type cards + end card (flat 2D, like the reference's closing section) */
const TYPE = [
  { a: T_TYPE, b: 16.1, bg: '#c58be8', col: '#ffffff', txt: 'Posts.', size: 8 },

  { a: 16.85, b: 17.6, bg: '#8a5cff', col: '#ffffff', txt: 'Stories.', size: 8 },
  { a: 17.6, b: T_END, bg: '#f6f1f4', col: '#2a1f3d', txt: '<span style="color:#ff2f92">&#9632;</span>&nbsp; Made for your brand', size: 2.4 },
];
function setOverlays(t) {

  subEl.textContent = s;

/* motion blur: average several sub-frames across the shutter; more samples when things move fast */
